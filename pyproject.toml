[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffmind"
version = "1.2.0"
description = "AI-powered git diff reviewer — streaming analysis, concurrent batch mode, live Rich UI, HTML export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["git", "diff", "code-review", "ai", "cli", "anthropic", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.20",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov"]

[project.scripts]
diffmind = "diffmind.cli:entry_point"

[tool.setuptools.packages.find]
where = ["."]
include = ["diffmind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
